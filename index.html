<!DOCTYPE html>
<html lang="ja" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="description" content="飲んだお酒から血中アルコール濃度と酩酊度を推定するチェッカー" />
    <meta name="theme-color" content="#0b1020" />
    <title>酩酊度チェッカー</title>
    <link rel="icon" href="assets/img/favicon.ico" sizes="32x32" />
    <link rel="stylesheet" href="assets/style.css" />
  </head>

  <body>
    <div class="app">
      <!-- ============================================================
           ヘッダー
           ============================================================ -->
      <header class="appbar">
        <p class="appbar__brand">
          <span class="appbar__logo" aria-hidden="true">🍻</span>
          <span>酩酊度チェッカー</span>
        </p>
        <button
          type="button"
          class="icon-btn"
          id="ThemeToggleButton"
          title="テーマを切り替え"
          aria-label="テーマを切り替え"
        >
          ☀️
        </button>
      </header>

      <!-- ============================================================
           タブ（スマホでは画面下に固定される）
           ============================================================ -->
      <nav class="tabs" role="tablist" aria-label="画面切り替え">
        <button
          type="button"
          class="tab is-active"
          role="tab"
          data-view="judge"
          aria-selected="true"
          aria-controls="view-judge"
        >
          <span class="tab__icon" aria-hidden="true">🍺</span>
          <span class="tab__label">判定</span>
        </button>
        <button
          type="button"
          class="tab"
          role="tab"
          data-view="profile"
          aria-selected="false"
          aria-controls="view-profile"
        >
          <span class="tab__icon" aria-hidden="true">👤</span>
          <span class="tab__label">プロフィール</span>
        </button>
        <button
          type="button"
          class="tab"
          role="tab"
          data-view="history"
          aria-selected="false"
          aria-controls="view-history"
        >
          <span class="tab__icon" aria-hidden="true">🕘</span>
          <span class="tab__label">履歴</span>
        </button>
      </nav>

      <main class="main">
        <!-- ==========================================================
             判定画面
             ========================================================== -->
        <section id="view-judge" class="view is-active" role="tabpanel">
          <div class="layout">
            <div class="layout__main">
              <!-- 飲んだお酒 -->
              <section class="card">
                <header class="card__head">
                  <h2 class="card__title">飲んだお酒</h2>
                  <p class="card__sub">タップで1杯ずつ追加</p>
                </header>

                <div class="preset-grid" id="PresetGrid"></div>

                <div class="drink-list" id="DrinkList" aria-live="polite"></div>

                <div class="card__actions">
                  <button type="button" class="btn btn--ghost" id="AddCustomButton">
                    ＋ 自由入力で追加
                  </button>
                  <button type="button" class="btn btn--ghost" id="ResetDrinksButton">
                    リセット
                  </button>
                </div>
              </section>

              <!-- 飲んだ時間・条件 -->
              <section class="card">
                <header class="card__head">
                  <h2 class="card__title">飲み始めた時刻</h2>
                  <p class="card__sub">経過した時間ぶんは肝臓が分解します</p>
                </header>

                <div class="time-row">
                  <label class="field field--time">
                    <span class="field__label">時刻</span>
                    <input type="time" class="input" id="StartTimeInput" />
                  </label>

                  <div class="chips" id="ElapsedChips">
                    <button type="button" class="chip" data-minutes="0">今</button>
                    <button type="button" class="chip" data-minutes="60">1時間前</button>
                    <button type="button" class="chip" data-minutes="120">2時間前</button>
                    <button type="button" class="chip" data-minutes="180">3時間前</button>
                    <button type="button" class="chip" data-minutes="300">5時間前</button>
                  </div>
                </div>

                <p class="hint" id="ElapsedHint"></p>

                <hr class="divider" />

                <label class="switch">
                  <input type="checkbox" id="UseProfileCheck" checked />
                  <span class="switch__track" aria-hidden="true"></span>
                  <span class="switch__text">プロフィールで個人補正する</span>
                </label>
                <p class="hint" id="ProfileHint"></p>
              </section>
            </div>

            <!-- 結果パネル -->
            <aside class="layout__side">
              <div class="side-sticky">
                <section class="card card--result" id="ResultPanel" aria-live="polite"></section>

                <button type="button" class="btn btn--primary btn--block" id="SaveResultButton">
                  この判定を履歴に残す
                </button>

                <section class="card card--compact">
                  <header class="card__head">
                    <h2 class="card__title">プロフィール</h2>
                  </header>
                  <div id="ProfileSummary"></div>
                </section>

                <p class="disclaimer">
                  推定値は統計式による目安であり、実際の血中濃度・法的判断を保証するものではありません。
                  飲酒後は時間の経過にかかわらず運転しないでください。
                </p>
              </div>
            </aside>
          </div>
        </section>

        <!-- ==========================================================
             プロフィール画面
             ========================================================== -->
        <section id="view-profile" class="view" role="tabpanel">
          <div class="layout layout--narrow">
            <div class="layout__main">
              <form class="card" id="ProfileForm">
                <header class="card__head">
                  <h2 class="card__title">あなたの体格と飲酒習慣</h2>
                  <p class="card__sub">
                    体重は必須です。身長を入れると分配係数を個人推定できます。
                  </p>
                </header>

                <fieldset class="segmented">
                  <legend class="field__label">性別</legend>
                  <div class="segmented__group">
                    <label class="segmented__item">
                      <input type="radio" name="sex" value="male" checked />
                      <span>男性</span>
                    </label>
                    <label class="segmented__item">
                      <input type="radio" name="sex" value="female" />
                      <span>女性</span>
                    </label>
                  </div>
                </fieldset>

                <div class="form-grid">
                  <label class="field">
                    <span class="field__label">年齢</span>
                    <span class="field__control">
                      <input
                        type="text"
                        class="input input--num"
                        id="AgeInput"
                        inputmode="numeric"
                        maxlength="3"
                        placeholder="30"
                      />
                      <span class="field__unit">歳</span>
                    </span>
                  </label>

                  <label class="field">
                    <span class="field__label">身長</span>
                    <span class="field__control">
                      <input
                        type="text"
                        class="input input--num"
                        id="HeightInput"
                        inputmode="numeric"
                        maxlength="3"
                        placeholder="170"
                      />
                      <span class="field__unit">cm</span>
                    </span>
                  </label>

                  <label class="field">
                    <span class="field__label">体重<em class="req">必須</em></span>
                    <span class="field__control">
                      <input
                        type="text"
                        class="input input--num"
                        id="WeightInput"
                        inputmode="decimal"
                        maxlength="5"
                        placeholder="60"
                      />
                      <span class="field__unit">kg</span>
                    </span>
                  </label>
                </div>

                <label class="field field--range">
                  <span class="field__label">
                    週の平均飲酒日数<b class="field__value" id="WeeklyValue">2日</b>
                  </span>
                  <input type="range" id="WeeklyInput" min="0" max="7" step="1" value="2" />
                  <span class="field__scale"><span>0日</span><span>毎日</span></span>
                </label>

                <div class="card__actions">
                  <button type="submit" class="btn btn--primary">保存する</button>
                  <button type="button" class="btn btn--ghost" id="ClearProfileButton">
                    削除
                  </button>
                </div>
              </form>

              <section class="card">
                <header class="card__head">
                  <h2 class="card__title">この内容で使われる係数</h2>
                  <p class="card__sub">入力に合わせてその場で変わります</p>
                </header>
                <div class="coef-list" id="ProfileCoefficients"></div>
              </section>
            </div>
          </div>
        </section>

        <!-- ==========================================================
             履歴画面
             ========================================================== -->
        <section id="view-history" class="view" role="tabpanel">
          <div class="layout layout--narrow">
            <div class="layout__main">
              <section class="card">
                <header class="card__head card__head--row">
                  <div>
                    <h2 class="card__title">判定履歴</h2>
                    <p class="card__sub" id="HistoryCount"></p>
                  </div>
                  <button type="button" class="btn btn--ghost" id="ClearHistoryButton">
                    すべて削除
                  </button>
                </header>

                <div class="history-list" id="HistoryList"></div>
              </section>
            </div>
          </div>
        </section>
      </main>

      <!-- スマホ用の固定サマリー -->
      <div class="mini-summary" id="MiniSummary" hidden></div>

      <footer class="footer">
        <span>Ver.2.0.0</span>
        <span>データはこの端末のブラウザにのみ保存されます</span>
      </footer>
    </div>

    <!-- 計算・データ -->
    <script src="scripts/core/presets.js"></script>
    <script src="scripts/core/bac.js"></script>
    <script src="scripts/core/store.js"></script>
    <!-- 共通UI -->
    <script src="scripts/ui/dom.js"></script>
    <script src="scripts/ui/dialog.js"></script>
    <!-- 各画面 -->
    <script src="scripts/views/drinks.js"></script>
    <script src="scripts/views/result.js"></script>
    <script src="scripts/views/profile.js"></script>
    <script src="scripts/views/history.js"></script>
    <!-- 起動 -->
    <script src="scripts/app.js"></script>
  </body>
</html>
