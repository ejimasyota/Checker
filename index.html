<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>酩酊度チェックサイト</title>
    <link rel="stylesheet" href="asetts/style.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <nav>
          <button class="Button" id="JudgeDispButton">判定画面</button>
          <button class="Button" id="UserInfoDispButton">ユーザー情報</button>
          <button class="Button" id="HistoryDispButton">履歴</button>
        </nav>
      </header>

      <!-- 判定画面 -->
      <div id="screen-start" class="screen active">
        <div class="cols">
          <div>
            <div class="CardContainer">
              <h2 class="small">飲んだお酒を選択</h2>
              <p class="muted">※度数（%）・本数・容量(ml) は必須項目です。</p>
              <!-- ドリンクカードコンテナ -->
              <div
                id="DrinkContainer"
                class="drink-grid"
                aria-live="polite"
              ></div>
              <div class="ButtonContainer" style="margin-top: 10px">
                <button class="Button" id="AddDrinkButton">種類追加</button>
                <button class="Button" id="ResetDrinkButton">リセット</button>
              </div>
            </div>

            <div class="CardContainer" style="margin-top: 12px">
              <h3 class="small">判定</h3>
              <!-- ユーザー情報使用チェックボックス -->
              <div style="margin-top: 8px">
                <label
                  ><input type="checkbox" id="UseUserInfoCheck" />
                  ユーザー情報を利用する</label
                >
              </div>
              <div style="margin-top: 8px">
                <button class="Button" id="JudgeButton">判定する</button>
              </div>
              <!-- 判定結果表示コンテナ -->
              <div id="JudgeResult" style="margin-top: 12px"></div>
            </div>
          </div>

          <aside>
            <!-- ユーザー情報表示コンテナ -->
            <div class="CardContainer">
              <h3 class="small">ユーザー情報</h3>
              <div id="UserInfo" class="muted-small">
                保存された情報がここに表示されます。
              </div>
            </div>

            <div class="CardContainer" style="margin-top: 12px">
              <h3 class="small">メモ</h3>
              <p class="muted-small">
                データの保存はブラウザのローカルストレージを使用しています。
              </p>
            </div>
          </aside>
        </div>
      </div>

      <!-- ユーザー情報画面 -->
      <div id="screen-user" class="screen">
        <div class="CardContainer">
          <h2 class="small">ユーザー情報を入力・保存</h2>
          <div
            style="
              display: grid;
              grid-template-columns: repeat(2, 1fr);
              gap: 10px;
            "
          >
            <div>
              <label>性別</label>
              <select id="GenderElement">
                <option value="male">男性</option>
                <option value="female">女性</option>
              </select>
              <label style="margin-top: 6px">年齢</label>
              <input type="number" id="AgeElement" min="1" max="120" />
              <label style="margin-top: 6px">血液型</label>
              <select id="BloodType">
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="O">O</option>
                <option value="AB">AB</option>
              </select>
            </div>
            <div>
              <label>体重（kg）</label>
              <input type="number" id="WeightElement" min="20" max="300" />
              <label style="margin-top: 6px">週の平均飲酒日数（日）</label>
              <input type="number" id="WeeklyElement" min="0" />
            </div>
          </div>
          <div class="ButtonContainer" style="margin-top: 10px">
            <button class="Button" id="SaveUserInfoButton">保存</button>
            <button class="Button" id="ClearUserInfoButton">削除</button>
          </div>
        </div>
      </div>

      <!-- 履歴画面 -->
      <div id="screen-history" class="screen">
        <div class="CardContainer">
          <h2 class="small">判定結果履歴</h2>
          <div class="history-list" id="historyList"></div>
          <div class="ButtonContainer" style="margin-top: 8px">
            <button class="Button" id="ExportButton">エクスポート</button
            ><button class="Button" id="ClearHistoryButton">履歴クリア</button>
          </div>
        </div>
      </div>

      <footer>Ver.1.0.0</footer>
    </div>
    <script src="script/public.js"></script>
    <script src="script/script.js"></script>
  </body>
</html>
